<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicConnect - Citizen Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Citizen Portal Dedicated Stylesheet -->
  <link rel="stylesheet" href="/citizen.css">
</head>
<body>

  <div class="portal-container">
    <!-- Left Navigation Sidebar (Dark Navy #0b132b directly matching screenshot) -->
    <aside class="portal-sidebar" id="portal-sidebar">
      <div class="sidebar-brand">
        <a href="/citizen/dashboard" class="brand-logo-row" onclick="event.preventDefault(); navigateTo('/citizen/dashboard');">
          <div class="brand-icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <div>
            <div class="brand-name">Civic<span style="color: #60a5fa;">Connect</span></div>
            <div class="brand-role-subtitle">CITIZEN</div>
          </div>
        </a>
      </div>

      <nav class="sidebar-nav">
        <!-- 1. My Dashboard -->
        <button type="button" class="nav-item active" data-route="/citizen/dashboard" onclick="navigateTo('/citizen/dashboard')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9"/>
            <rect x="14" y="3" width="7" height="5"/>
            <rect x="14" y="12" width="7" height="9"/>
            <rect x="3" y="16" width="7" height="5"/>
          </svg>
          <span>My Dashboard</span>
        </button>

        <!-- 2. Report Problem -->
        <button type="button" class="nav-item" data-route="/citizen/report" onclick="navigateTo('/citizen/report')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>Report Problem</span>
        </button>

        <!-- 3. Track Complaint -->
        <button type="button" class="nav-item" data-route="/citizen/track" onclick="navigateTo('/citizen/track')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <span>Track Complaint</span>
        </button>

        <!-- 4. City Issues -->
        <button type="button" class="nav-item" data-route="/citizen/city-issues" onclick="navigateTo('/citizen/city-issues')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
          <span>City Issues</span>
        </button>

        <!-- 5. Ward Issues -->
        <button type="button" class="nav-item" data-route="/citizen/ward-issues" onclick="navigateTo('/citizen/ward-issues')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
            <line x1="8" y1="2" x2="8" y2="18"/>
            <line x1="16" y1="6" x2="16" y2="22"/>
          </svg>
          <span>Ward Issues</span>
        </button>
      </nav>

      <!-- Sidebar Footer: Citizen Profile Card + Sign Out -->
      <div class="sidebar-footer">
        <div class="citizen-profile-row" onclick="navigateTo('/citizen/profile')" title="View Citizen Profile">
          <div class="citizen-avatar-circle" id="sidebar-citizen-avatar">DC</div>
          <div class="citizen-info">
            <div class="citizen-name" id="sidebar-citizen-name">Demo Citizen</div>
            <div class="citizen-email" id="sidebar-citizen-email">citizen@demo.com</div>
          </div>
        </div>
        <button type="button" class="btn-signout" onclick="handlePortalSignOut()">
          Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Viewport -->
    <div class="portal-main">
      <!-- Top Sticky White Header -->
      <header class="portal-header">
        <div class="header-left">
          <button type="button" class="mobile-menu-btn" onclick="toggleMobileSidebar()" aria-label="Toggle Navigation Menu">
            ☰
          </button>
          <h1 class="header-page-title" id="header-page-title">My Dashboard</h1>
        </div>

        <div class="header-right">
          <!-- Notification Bell -->
          <button type="button" id="btn-header-bell" class="btn-icon-header" onclick="toggleNotificationDropdown()" aria-label="Notifications" title="Notifications">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="notification-badge" id="header-notification-badge"></span>
          </button>

          <!-- Notification Dropdown Panel -->
          <div id="notification-dropdown-panel" class="notification-dropdown">
            <div class="notification-header">
              <div>
                <h4>Notifications</h4>
                <div style="font-size:0.7rem; color:#64748b;">Municipal Verified Updates</div>
              </div>
              <button type="button" class="btn-clear-notifications" onclick="clearAllNotifications()">
                Clear All
              </button>
            </div>
            <div id="notification-items-list" class="notification-list">
              <!-- Dynamically rendered -->
            </div>
          </div>
        </div>
      </header>

      <!-- Main Dynamic Content Container -->
      <main id="citizen-main-content" class="portal-content">
        <!-- Rendered by citizen.js routes -->
      </main>
    </div>
  </div>

  <!-- Global Modal Overlay Container -->
  <div id="portal-modal-overlay" class="portal-modal-overlay" onclick="if(event.target === this) closePortalModal()">
    <div id="portal-modal-container" class="portal-modal-card">
      <div id="portal-modal-content"></div>
    </div>
  </div>

  <!-- Leaflet Map JS Engine -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Citizen Portal Controller & Routing -->
  <script src="/citizen.js"></script>
</body>
</html>
